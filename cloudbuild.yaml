steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gopi-webapp', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gopi-webapp']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - compute
      - ssh
      - gopi-vm
      - --zone=us-central1-a
      - --command
      - |
        docker pull gcr.io/$PROJECT_ID/gopi-webapp
        docker stop web || true
        docker rm web || true
        docker run -d -p 80:80 --name web gcr.io/$PROJECT_ID/gopi-webapp
